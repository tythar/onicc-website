<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Ribbon Gradient: Deep Navy -->
    <linearGradient id="navyRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153B63" />
      <stop offset="100%" stop-color="#0E233C" />
    </linearGradient>

    <!-- Foreground Ribbon Gradient: Vibrant Turquoise to Royal Cyan -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CD4D9" />
      <stop offset="50%" stop-color="#1582D8" />
      <stop offset="100%" stop-color="#0B5CA8" />
    </linearGradient>

    <!-- Mid Ribbon Gradient -->
    <linearGradient id="midRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27A8B8" />
      <stop offset="100%" stop-color="#144C82" />
    </linearGradient>

    <!-- Silver Metallic Orbital Swoosh -->
    <linearGradient id="silverOrbit" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.95" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Spherical Globe Structure formed by interwoven bands -->
  <g transform="translate(6, 6)" filter="url(#softShadow)">
    <!-- Back Interior Ribbon 1 (Deep Navy) -->
    <path d="M 38 18 C 50 18, 72 26, 78 48 C 84 66, 74 88, 56 94 C 50 96, 42 96, 38 92 C 54 84, 62 66, 56 46 C 52 32, 42 22, 38 18 Z" fill="url(#navyRibbon)" />
    
    <!-- Back Interior Ribbon 2 (Deep Violet-Navy) -->
    <path d="M 22 36 C 26 24, 42 16, 56 16 C 42 24, 30 38, 28 58 C 26 74, 34 86, 44 92 C 34 90, 22 80, 20 64 C 18 52, 19 42, 22 36 Z" fill="url(#navyRibbon)" />

    <!-- Core Vertical Curved Ribbon (Mid Navy-Turquoise) -->
    <path d="M 44 14 C 62 16, 76 30, 78 52 C 80 72, 70 88, 52 98 C 66 88, 70 70, 64 50 C 58 32, 48 20, 44 14 Z" fill="url(#midRibbon)" />

    <!-- Foreground Ribbon Band 1 (Top-Left to Center) -->
    <path d="M 20 40 C 26 24, 46 12, 68 16 C 54 22, 40 36, 36 56 C 32 74, 38 88, 48 96 C 36 94, 22 80, 18 62 C 16 52, 17 44, 20 40 Z" fill="url(#cyanRibbon)" />

    <!-- Foreground Sweeping Ribbon Band 2 (Major Diagonal Arch) -->
    <path d="M 28 22 C 48 14, 76 22, 88 44 C 98 62, 92 82, 78 94 C 88 80, 90 60, 80 44 C 70 28, 48 20, 28 22 Z" fill="url(#cyanRibbon)" />

    <!-- Foreground Bottom Hook Ribbon -->
    <path d="M 42 54 C 54 44, 74 46, 84 60 C 92 72, 88 86, 74 96 C 84 84, 84 72, 76 62 C 68 52, 52 50, 42 54 Z" fill="url(#cyanRibbon)" />

    <!-- Sweeping Silver Metallic Orbital Ring -->
    <!-- The ring sweeps from far left (x=2), under and across the globe face, then curls out to the right (x=106) -->
    <path d="M 4 48 C 1 36, 12 32, 20 32 C 12 38, 8 46, 14 58 C 24 76, 52 86, 78 82 C 92 80, 102 70, 106 62 C 104 68, 96 76, 84 80 C 56 88, 22 78, 8 58 C 5 54, 4 50, 4 48 Z" fill="url(#silverOrbit)" opacity="0.95" />
    <path d="M 8 46 C 2 34, 18 30, 28 32 C 16 36, 10 44, 16 56 C 28 74, 58 84, 84 80 C 96 78, 104 70, 108 64 C 102 72, 92 78, 80 80 C 52 86, 24 76, 12 56 C 9 52, 8 48, 8 46 Z" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>
